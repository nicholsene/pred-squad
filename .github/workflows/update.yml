name: Update squad data

on:
  schedule:
    - cron: "0,30 * * * *"   # every 30 min; meta is refreshed once a day below
  push:                        # also run when the fetcher or config changes
    branches: [main]
    paths: ["docs/**", "!docs/data/**", "scripts/**", "config/**", "database/**", "requirements.txt", ".github/**"]
  workflow_dispatch:
    inputs:
      meta:
        description: "Also refresh patch meta"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Decide whether to refresh meta
        id: meta
        run: |
          stale=$(python -c "import json,datetime as d;m=json.load(open('docs/data/meta.json'));t=d.datetime.fromisoformat(m['updatedAt'].replace('Z','+00:00'));print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()>72000))" 2>/dev/null || echo 1)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.meta }}" = "true" ] || [ "$stale" = "1" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--skip-meta" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh and publish from latest main
        env:
          PREDGG_CLIENT_ID: ${{ secrets.PREDGG_CLIENT_ID }}
          PREDGG_CLIENT_SECRET: ${{ secrets.PREDGG_CLIENT_SECRET }}
          PREDGG_REFRESH_TOKEN: ${{ secrets.PREDGG_REFRESH_TOKEN }}
        run: bash scripts/refresh.sh ${{ steps.meta.outputs.flag }}
